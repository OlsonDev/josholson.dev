[tools]
bun = "1.4.3"
dotnet = "10.0.402"
gh = "2.102.0"

[env]
PODMAN_COMPOSE_WARNING_LOGS = "false"

# Podman is not installed by mise: install it separately.
# Waypoint has no Windows build, so it runs in the tools container (tools/Containerfile).

[tasks."tools:up"]
description = "Start the tools container (builds the image on first use)"
run = "podman compose -f compose.yaml -f compose.dev.yaml up -d tools"

[tasks.waypoint]
description = "Run waypoint in the tools container, e.g. mise run waypoint migrate"
depends = ["tools:up"]
run = "podman compose -f compose.yaml -f compose.dev.yaml exec tools waypoint"

# scripts/schema-docs.cs reads the dev database through the POSTGRES_* settings in .env.
# The database must be running with the migrations applied.
[tasks."schema:doc"]
description = "Regenerate docs/schema from the dev database"
run = "dotnet run scripts/schema-docs.cs -- doc"

[tasks."schema:doc".env]
_.file = ".env"

[tasks."schema:check"]
description = "Fail if docs/schema differs from what the dev database would generate"
run = "dotnet run scripts/schema-docs.cs -- check"

[tasks."schema:check".env]
_.file = ".env"
