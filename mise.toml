[tools]
bun = "1.4.3"
dotnet = "11.0.100"
gh = "2.102.0"

[env]
PODMAN_COMPOSE_WARNING_LOGS = "false"

# Podman is not installed by mise: install it separately.
# Waypoint has no Windows build, so it runs in the tools container (tools/Containerfile).

[tasks."tools:up"]
description = "Start the tools container (builds the image on first use)"
run = "podman compose -f compose.yaml -f compose.dev.yaml up -d tools"

[tasks.waypoint]
description = "Run waypoint in the tools container, e.g. mise run waypoint migrate"
depends = ["tools:up"]
run = "podman compose -f compose.yaml -f compose.dev.yaml exec tools waypoint"

[tasks.passkey]
description = "Enroll or sign in with a real security key against a running API, e.g. mise run passkey enroll <token>"
run = "dotnet run scripts/passkey-cli.cs --"

# scripts/schema-docs.cs reads the dev database through the POSTGRES_* settings in .env.
# The database must be running with the migrations applied.
[tasks."schema:doc"]
description = "Regenerate docs/schema from the dev database"
run = "dotnet run scripts/schema-docs.cs -- doc"

[tasks."schema:doc".env]
_.file = ".env"

[tasks."schema:check"]
description = "Fail if docs/schema differs from what the dev database would generate"
run = "dotnet run scripts/schema-docs.cs -- check"

[tasks."schema:check".env]
_.file = ".env"

# Creates or updates the DML-only josholson_api role in the dev database (ADR 0018). Safe to rerun, and it must be
# rerun after a migration adds a schema. The password comes from POSTGRES_API_PASSWORD in .env.
[tasks."db:provision"]
description = "Create or update the DML-only API role in the dev database"
run = "podman compose -f compose.yaml -f compose.dev.yaml exec -T postgres psql -U $POSTGRES_USER -d $POSTGRES_DB -v ON_ERROR_STOP=1 -v api_password=$POSTGRES_API_PASSWORD < JoshOlson.Database/provisioning/api_role.sql"

[tasks."db:provision".env]
_.file = ".env"

# The seed tool's command line (ADR 0033, a scoped database per test). Layers live in JoshOlson.Database/seeds.
[tasks."seeds:list"]
description = "Print the seed layer tree with row counts per table"
run = "dotnet run --project JoshOlson.Seed -- list"

# Writes migrations/schema.lock.yaml from the dev database (ADR 0034, lock file and branch-safe migration). Run
# `mise run waypoint migrate` first: the database must have applied exactly the migrations on disk. With layers it also
# checks that each still builds into a template (the `tools` container runs the migrations). Reads .env.
[tasks."seeds:migrate"]
description = "Make migrations/schema.lock.yaml describe the dev database at the newest migration"
depends = ["tools:up"]
run = "dotnet run scripts/seed.cs -- migrate"

[tasks."seeds:migrate".env]
_.file = ".env"

# Before the first deploy migrations may be rewritten (sql.md), which leaves the lock's checksums stale. This starts the
# lock over from the dev database, ignoring the old lock's version and checksums. Retire it at the first deploy.
[tasks."seeds:relock"]
description = "Start migrations/schema.lock.yaml over from the dev database, for migrations rewritten before the first deploy"
depends = ["tools:up"]
run = "dotnet run scripts/seed.cs -- relock"

[tasks."seeds:relock".env]
_.file = ".env"

# Builds the schema template and each layer's template (ADR 0033, a scoped database per test); templates that are
# current are left alone. Needs the dev database server and the `tools` container. Reads .env.
[tasks."seeds:bake"]
description = "Build the schema template and every seed layer's template"
depends = ["tools:up"]
run = "dotnet run --project JoshOlson.Seed -- bake"

[tasks."seeds:bake".env]
_.file = ".env"

# Drops the dev database and makes it again from a layer, its relative times measured from now: mise run seed <layer>.
# Everything in the dev database is lost. Dev only.
[tasks.seed]
description = "Drop the dev database and rebuild it from a seed layer, e.g. mise run seed more-tags"
depends = ["tools:up"]
run = "dotnet run --project JoshOlson.Seed -- seed"

[tasks.seed.env]
_.file = ".env"

# A database of its own, seed_test_<id>, cloned from a layer's template: mise run seed:test 42 more-tags.
[tasks."seed:test"]
description = "Make a scoped database seed_test_<id> from a seed layer, e.g. mise run seed:test 42 more-tags"
depends = ["tools:up"]
run = "dotnet run --project JoshOlson.Seed -- test"

[tasks."seed:test".env]
_.file = ".env"

# Drops the seed tool's databases (never the dev database) that the current migrations and layers no longer name: old
# templates, test databases, and builds that died halfway. `--all` drops the current templates too.
[tasks."seed:clean"]
description = "Drop the seed tool's stale databases (--all: the current templates too)"
run = "dotnet run --project JoshOlson.Seed -- clean"

[tasks."seed:clean".env]
_.file = ".env"

# Drops the dev database and rebuilds it from the migrations: what a rewritten migration needs, since Waypoint refuses
# an applied migration whose file changed. Everything in the dev database is lost. Dev only (compose.dev.yaml).
[tasks."db:reset"]
description = "Drop the dev database and rebuild it from the migrations, then provision the API role"
depends = ["tools:up"]
run = [
  "podman compose -f compose.yaml -f compose.dev.yaml exec -T postgres psql -U $POSTGRES_USER -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS \"'$POSTGRES_DB'\" WITH (FORCE)' -c 'CREATE DATABASE \"'$POSTGRES_DB'\"'",
  "mise run waypoint migrate",
  "mise run db:provision",
]

[tasks."db:reset".env]
_.file = ".env"

# The test tasks start the dev containers (the database, and `tools` for the seed tool's templates), read .env for the
# dev database (POSTGRES_*), and run as the josholson_api role, so run db:provision first (see CLAUDE.md).
# Tests live beside the code as *.Tests.cs and are compiled in for Debug (see JoshOlson.Api/JoshOlson.Api.csproj).
[tasks.test]
description = "Run every project's tests (Debug build, tests compiled in)"
depends = ["tools:up"]
run = "dotnet test --solution JoshOlson.slnx"

[tasks.test.env]
_.file = ".env"

[tasks."test:release"]
description = "Run every project's tests against a Release build"
depends = ["tools:up"]
run = "dotnet test --solution JoshOlson.slnx -c Release -p:IncludeTests=true"

[tasks."test:release".env]
_.file = ".env"

[tasks."test:missing"]
description = "List source files with no sibling *.Tests.cs"
run = "dotnet run scripts/missing-tests.cs"

# Every rule in the analyzer packages must have a severity in .editorconfig (ADR 0030). Reads the restored packages.
[tasks."analyzers:check"]
description = "Fail if an installed analyzer rule has no severity in .editorconfig"
run = "dotnet run scripts/analyzers.cs -- check"

[tasks."analyzers:add"]
description = "Append analyzer rules missing from .editorconfig, at what they do today"
run = "dotnet run scripts/analyzers.cs -- add"

# The scripts are file-based apps, which `dotnet format` cannot open, so building them is the check (ADR 0030).
[tasks."scripts:check"]
description = "Build every loose script with the style rules and analyzers on"
run = "dotnet run scripts/check-scripts.cs"

# A list is on the line of its opening token or one item per line. Roslynator's RCS0053 cannot express that (it also
# rejects the trailing block lambdas and `||` chains the repo uses), so scripts/list-layout.cs checks it. Upstream:
# https://github.com/dotnet/roslynator/issues/1861 and https://github.com/meziantou/Meziantou.Analyzer/issues/1748
[tasks."lists:check"]
description = "Fail if a wrapped list (arguments, parameters, initializers) has several items on one line"
run = "dotnet run scripts/list-layout.cs"
