description: The tags every other layer starts from
tables:
  tag.slug:
    insert:
      - { slug_id: 1, tag_id: 1, slug: database, is_canonical: true, created_utc: 0s }
      - { slug_id: 2, tag_id: 2, slug: language, is_canonical: true, created_utc: 0s }
      - { slug_id: 3, tag_id: 3, slug: tool, is_canonical: true, created_utc: 0s }
  tag.tag:
    insert:
      - { tag_id: 1, name: Database, description: ~, description_html: ~, color: indigo-200, version: 1 }
      - { tag_id: 2, name: Language, description: ~, description_html: ~, color: emerald-200, version: 1 }
      - { tag_id: 3, name: Tool, description: ~, description_html: ~, color: amber-200, version: 1 }
