# `bun lint`. The rules live here, not in .oxlintrc.json (see that file). Type-aware rules read the project's tsconfig.json.
[lint]
typeAware = true
ignorePatterns = ["src/lib/api/schema.ts"] # generated by `mise api:openapi`

[lint.categories]
correctness = "error"
suspicious = "error"

[lint.rules]
# Date is banned, as a value, as a type, and through the global object. Use Temporal (Temporal.Instant for an instant).
"no-restricted-globals" = ["error", { name = "Date", message = "Date is banned: use Temporal." }]
"typescript/no-restricted-types" = ["error", { types = { Date = { message = "Date is banned: use Temporal." } } }]
"no-restricted-properties" = [
  "error",
  { object = "globalThis", property = "Date", message = "Date is banned: use Temporal." },
  { object = "window", property = "Date", message = "Date is banned: use Temporal." },
]

# An API call nobody awaits runs on its own, and a failure is lost. These need types, so they skip .svelte files.
"typescript/no-floating-promises" = "error"
"typescript/no-misused-promises" = "error"

# `export {}` is how a .d.ts file (SvelteKit's app.d.ts) becomes a module.
"unicorn/require-module-specifiers" = "off"

# Like the C# rule "foreach, not ForEach".
"unicorn/no-array-for-each" = "error"
"eqeqeq" = ["error", "always"]
